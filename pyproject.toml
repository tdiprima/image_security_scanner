[project]
name = "image-security-scanner"
version = "0.1.0"
description = "Image security scanner for prompt injection and malicious content"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "piexif>=1.1.3",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.scripts]
image-scanner = "image_scanner.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["image_scanner"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
